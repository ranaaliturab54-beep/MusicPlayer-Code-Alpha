<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength — Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080810;
    --card: #10101c;
    --surface: #16162a;
    --border: rgba(255,255,255,0.07);
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --pink: #f472b6;
    --text: #f1f0ff;
    --muted: rgba(241,240,255,0.4);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    transition: all 1s ease;
  }

  .glow1 { width: 400px; height: 400px; background: rgba(124,58,237,0.15); top: -100px; right: -100px; }
  .glow2 { width: 300px; height: 300px; background: rgba(244,114,182,0.1); bottom: -80px; left: -80px; }

  .player {
    width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7);
    position: relative;
    z-index: 1;
  }

  /* Album art section */
  .artwork-section {
    position: relative;
    height: 260px;
    overflow: hidden;
  }

  .artwork-bg {
    position: absolute;
    inset: -20px;
    filter: blur(30px) saturate(1.5);
    opacity: 0.4;
    transition: background-image 1s ease;
  }

  .artwork {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 160px;
    height: 160px;
    border-radius: 18px;
    object-fit: cover;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: transform 0.5s ease;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .artwork.playing { animation: artSpin 20s linear infinite; }
  .artwork.paused { animation-play-state: paused; }

  @keyframes artSpin {
    from { border-radius: 18px; }
    25% { border-radius: 50%; }
    50% { border-radius: 18px; }
    75% { border-radius: 50%; }
    to { border-radius: 18px; }
  }

  /* Eq bars visual (decorative) */
  .eq-bars {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 24px;
  }

  .eq-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    animation: eqAnim 0.8s ease-in-out infinite alternate;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .eq-bar:nth-child(2) { animation-delay: 0.15s; }
  .eq-bar:nth-child(3) { animation-delay: 0.3s; }
  .eq-bar:nth-child(4) { animation-delay: 0.1s; }
  .eq-bar:nth-child(5) { animation-delay: 0.25s; }

  .eq-bars.active .eq-bar { opacity: 1; }

  @keyframes eqAnim {
    from { height: 4px; }
    to { height: 20px; }
  }

  /* Song info */
  .info {
    padding: 1.4rem 1.6rem 0.8rem;
  }

  .song-meta {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }

  .song-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-artist {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  .like-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 1.3rem;
    padding: 0.2rem;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .like-btn.liked { color: var(--pink); }
  .like-btn:hover { transform: scale(1.2); }

  /* Progress bar */
  .progress-section {
    padding: 0.4rem 1.6rem 0.6rem;
  }

  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--pink));
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s linear;
    position: relative;
  }

  .progress-bar-wrap:hover .progress-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -4px;
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(167,139,250,0.6);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 0.5rem;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
  }

  /* Controls */
  .controls {
    padding: 0 1.6rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    transition: all 0.2s ease;
    font-size: 0.95rem;
  }

  .ctrl-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .ctrl-btn.active { color: var(--accent); }

  .play-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    cursor: pointer;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    box-shadow: 0 8px 24px rgba(124,58,237,0.5);
    transition: all 0.2s ease;
  }

  .play-btn:hover { transform: scale(1.08); box-shadow: 0 12px 32px rgba(124,58,237,0.65); }
  .play-btn:active { transform: scale(0.96); }

  /* Volume */
  .volume-section {
    padding: 0 1.6rem 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .vol-icon { color: var(--muted); font-size: 0.9rem; }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(167,139,250,0.5);
    transition: transform 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  /* Playlist */
  .playlist {
    border-top: 1px solid var(--border);
    max-height: 180px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(167,139,250,0.3) transparent;
  }

  .playlist-header {
    padding: 0.8rem 1.6rem 0.4rem;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
  }

  .playlist-item {
    padding: 0.65rem 1.6rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 0;
  }

  .playlist-item:hover { background: rgba(255,255,255,0.04); }
  .playlist-item.active { background: rgba(124,58,237,0.12); }

  .pl-num {
    width: 18px;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
  }

  .playlist-item.active .pl-num { color: var(--accent); }

  .pl-info { flex: 1; overflow: hidden; }

  .pl-title {
    font-size: 0.85rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }

  .playlist-item.active .pl-title { color: var(--accent); }

  .pl-artist {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .pl-dur {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="player">
  <div class="artwork-section">
    <div class="artwork-bg" id="artBg"></div>
    <img class="artwork" id="artwork" src="" alt="">
    <div class="eq-bars" id="eqBars">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
  </div>

  <div class="info">
    <div class="song-meta">
      <div>
        <div class="song-title" id="songTitle">Track Title</div>
        <div class="song-artist" id="songArtist">Artist Name</div>
      </div>
      <button class="like-btn" id="likeBtn">♡</button>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">⇄</button>
    <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
    <button class="play-btn" id="playBtn">▶</button>
    <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
    <button class="ctrl-btn" id="repeatBtn" title="Repeat">↻</button>
  </div>

  <div class="volume-section">
    <span class="vol-icon">🔈</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
    <span class="vol-icon">🔊</span>
  </div>

  <div class="playlist">
    <div class="playlist-header">Up Next</div>
    <div id="playlistEl"></div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const tracks = [
  {
    title: 'Weightless',
    artist: 'Marconi Union',
    duration: '8:09',
    artwork: 'https://images.unsplash.com/photo-1614850523011-8f49ffc73908?w=300',
    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
  },
  {
    title: 'Midnight City',
    artist: 'M83',
    duration: '4:03',
    artwork: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300',
    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
  },
  {
    title: 'Stellar Dreams',
    artist: 'Neon Atlas',
    duration: '5:22',
    artwork: 'https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=300',
    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'
  },
  {
    title: 'Aurora Drift',
    artist: 'Celestial Echo',
    duration: '6:41',
    artwork: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300',
    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'
  },
  {
    title: 'Quantum Pulse',
    artist: 'Binary Bloom',
    duration: '4:15',
    artwork: 'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=300',
    src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3'
  },
];

let currentTrack = 0;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const likeBtn = document.getElementById('likeBtn');
const progressFill = document.getElementById('progressFill');
const progressWrap = document.getElementById('progressWrap');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volumeSlider = document.getElementById('volumeSlider');
const eqBars = document.getElementById('eqBars');

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function loadTrack(index) {
  const track = tracks[index];
  document.getElementById('songTitle').textContent = track.title;
  document.getElementById('songArtist').textContent = track.artist;
  document.getElementById('artwork').src = track.artwork;
  document.getElementById('artBg').style.backgroundImage = `url(${track.artwork})`;
  document.getElementById('artBg').style.backgroundSize = 'cover';
  audio.src = track.src;
  audio.volume = volumeSlider.value;
  progressFill.style.width = '0%';
  currentTimeEl.textContent = '0:00';
  totalTimeEl.textContent = track.duration;
  likeBtn.textContent = '♡';
  likeBtn.classList.remove('liked');
  renderPlaylist();
}

function play() {
  audio.play().catch(() => {});
  isPlaying = true;
  playBtn.textContent = '⏸';
  document.getElementById('artwork').className = 'artwork playing';
  eqBars.classList.add('active');
}

function pause() {
  audio.pause();
  isPlaying = false;
  playBtn.textContent = '▶';
  document.getElementById('artwork').className = 'artwork paused';
  eqBars.classList.remove('active');
}

function nextTrack() {
  if (isShuffle) {
    currentTrack = Math.floor(Math.random() * tracks.length);
  } else {
    currentTrack = (currentTrack + 1) % tracks.length;
  }
  loadTrack(currentTrack);
  if (isPlaying) play();
}

function prevTrack() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
  loadTrack(currentTrack);
  if (isPlaying) play();
}

playBtn.addEventListener('click', () => isPlaying ? pause() : play());
nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);

shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

repeatBtn.addEventListener('click', () => {
  isRepeat = !isRepeat;
  repeatBtn.classList.toggle('active', isRepeat);
  audio.loop = isRepeat;
});

likeBtn.addEventListener('click', () => {
  likeBtn.classList.toggle('liked');
  likeBtn.textContent = likeBtn.classList.contains('liked') ? '♥' : '♡';
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (!isRepeat) nextTrack();
});

progressWrap.addEventListener('click', e => {
  const rect = progressWrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pct * audio.duration;
});

volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value;
});

function renderPlaylist() {
  const pl = document.getElementById('playlistEl');
  pl.innerHTML = '';
  tracks.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (i === currentTrack ? ' active' : '');
    item.innerHTML = `
      <div class="pl-num">${i === currentTrack ? '♪' : i + 1}</div>
      <div class="pl-info">
        <div class="pl-title">${track.title}</div>
        <div class="pl-artist">${track.artist}</div>
      </div>
      <div class="pl-dur">${track.duration}</div>
    `;
    item.addEventListener('click', () => {
      currentTrack = i;
      loadTrack(currentTrack);
      play();
    });
    pl.appendChild(item);
  });
}

loadTrack(0);
</script>
</body>
</html>
